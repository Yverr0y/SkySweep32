ass="note" text-anchor="middle">PCB 1.6; LID CLEARANCE TARGET ≥1.5; BATTERY–PCB CLEARANCE 3.0</text><text x="1050.0" y="95.0" class="title" text-anchor="start">FIRST-PROTOTYPE INTERFACE NOTES</text><text x="1050.0" y="135.0" class="note" text-anchor="start">1. UNITS: mm. DO NOT SCALE DRAWING.</text><text x="1050.0" y="170.0" class="note" text-anchor="start">2. ENCLOSURE: printed indoor instrument case; not sealed or IP rated.</text><text x="1050.0" y="205.0" class="note" text-anchor="start">3. MATERIAL ASSUMPTION: PETG, 0.20 mm layers, 4 perimeters, 30% infill.</text><text x="1050.0" y="240.0" class="note" text-anchor="start">4. FASTENERS: 4 x DIN 912 M3 x 30 plus 4 x DIN 934 M3 nuts.</text><text x="1050.0" y="275.0" class="note" text-anchor="start">5. SERVICE OPENINGS: USB-C bottom; microSD right; J7 5.8 GHz right; J5 sub-GHz left.</text><text x="1050.0" y="310.0" class="note" text-anchor="start">6. OLED: Adafruit PID 326, lid snap cradle, keyed 4-pin JST-SH harness.</text><text x="1050.0" y="345.0" class="note" text-anchor="start">7. BATTERY: Adafruit PID 328 / LP785060 in 52 x 62 x 8.3 under-PCB bay.</text><text x="1050.0" y="380.0" class="note" text-anchor="start">8. BUTTONS: RESET / BOOT / USER independent plungers; 0.65 mm nominal travel.</text><text x="1050.0" y="415.0" class="note" text-anchor="start">9. CAD AUTHORITY: PCBA STEP, battery/display envelopes and generate_enclosure.py.</text><text x="1050.0" y="450.0" class="note" text-anchor="start">10. CAD CHECKS ARE NOT PHYSICAL VALIDATION. Measure the first print and PCBA.</text>
